# Fork-specific rayci configuration.
#
# This file overrides the built-in Ray CI config so that pipeline steps
# target our fork's infrastructure instead of Ray's upstream AWS accounts.
#
# Container registry for Wanda-built CI images (required).
# Wanda pushes/pulls images here during the build.
# Use LAN IP because wanda (go-containerregistry) enforces HTTPS for hostnames.
# IP addresses fall back to HTTP, which is what our insecure registry needs.
ci_work_repo: "192.168.7.176:5010/ci"

# S3/GCS path for temp files shared across build steps (required).
ci_temp: "/tmp/ci-temp/"

# S3 bucket for build artifacts (optional but recommended).
artifacts_bucket: ""

# Prefix for Wanda-built forge images. Use a domain that does not resolve
# publicly so the container runtime never accidentally pulls a remote image
# when a local build is intended.
forge_prefix: "cr.ray.io/rayproject/"

# Buildkite agent queues for image-building steps.
builder_queues:
  builder: "ethan-home"
  builder-arm64: "ethan-home"
  builder-windows: "ethan-home"

# Buildkite agent queues for test/runner steps.
# Map rayci instance types to queue names. Most steps target the
# "ethan-home" light queue; large (CPU-heavy) steps target "heavy"
# so they spread evenly across builders (1 heavy slot per host).
runner_queues:
  default: "ethan-home"
  small: "ethan-home"
  medium: "ethan-home"
  large: "heavy"
  gpu: "ethan-home"
  gpu-large: "ethan-home"
  g6-large: "ethan-home"
  macos-arm64: "ethan-home"
  medium-arm64: "ethan-home"
  windows: "ethan-home"

env:
  RAYCI_CHECKOUT_DIR: "set-by-pre-command-hook"
  RAYCI_GLOBAL_CONFIG: "ci/ray_ci/fork_config.yaml"
  BUILDKITE_BAZEL_CACHE_URL: "http://172.17.0.1:9090"
  RAYCI_STAGE: "premerge"
  RAYCI_DISABLE_TEST_DB: "1"
  GHCR_TOKEN: ""
  GITHUB_TOKEN: ""
  # Fix git "dubious ownership" error inside Docker containers.
  # Container user (forge, UID 2000) differs from checkout owner (UID 993).
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "*"

hook_env_keys:
  - RAYCI_CHECKOUT_DIR

docker_plugin:
  allow_mount_buildkite_agent: true
  add-host:
    - "build-host:172.17.0.1"
  volumes:
    # Literal path — shell variable syntax is not expanded by rayci/Docker plugin.
    - "/var/lib/cache/bazel-repo-cache:/bazel-repo-cache"
  environment:
    # Pass cache-related env vars from the Buildkite agent into Docker
    # containers so that pip install, bazel, etc. use local caches
    # instead of hitting the internet directly.
    - "PIP_INDEX_URL"
    - "PIP_TRUSTED_HOST"
    - "BUILDKITE_BAZEL_CACHE_URL"

# Tags that cause steps to be unconditionally skipped.
skip_tags:
  - disabled
  - skip-on-premerge

# Use Ray's changed-file rule files for conditional test selection.
test_rules_files:
  - .buildkite/test.rules.txt
  - .buildkite/always.rules.txt
