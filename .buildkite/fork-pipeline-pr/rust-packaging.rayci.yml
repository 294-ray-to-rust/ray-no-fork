group: rust packaging preflight
sort_key: rust-packaging-preflight
steps:
  # Stage 2 prerequisite chain: keep the image build path minimal, then run
  # the fail-fast compat check and the RayRust PR canary manifest inside the
  # built core image. Full main remains the exhaustive CI signal.
  - name: rust-ray-core-py310
    label: "wanda: rust ray-core py3.10 (x86_64)"
    wanda: ci/docker/ray-core.wanda.yaml
    env_file: rayci.env
    env:
      PYTHON_VERSION: "3.10"
      ARCH_SUFFIX: ""
      HOSTTYPE: "x86_64"
    depends_on:
      - forge
    tags:
      - always
      - release_wheels

  - name: rust-oss-ci-base-test-py310
    label: "wanda: rust oss-ci-base_test py3.10"
    wanda: ci/docker/base.test.wanda.yaml
    env:
      PYTHON: "3.10"
    depends_on:
      - forge
    tags:
      - always
      - cibase

  - name: rust-oss-ci-base-build-py310
    label: "wanda: rust oss-ci-base_build py3.10"
    wanda: ci/docker/base.build.wanda.yaml
    env:
      PYTHON: "3.10"
    depends_on:
      - rust-oss-ci-base-test-py310
    tags:
      - always
      - cibase

  - name: rust-corebuild-py310
    label: "wanda: rust corebuild py3.10"
    wanda: ci/docker/core.build.wanda.yaml
    env:
      PYTHON: "3.10"
      BASE_TYPE: "build"
      BUILD_VARIANT: "build"
    # Match main/MQ ordering: corebuild must be produced after forge and the
    # split Ray binary/dashboard images, or test_in_docker can run Python
    # sources against stale native extensions and fail with _raylet ABI
    # mismatches (GenericStub.dumps / PyCoreWorker.submit_task signatures).
    depends_on:
      - rust-oss-ci-base-build-py310
      - forge
      - rust-ray-core-py310
      - rust-ray-dashboard
    tags:
      - always
      - cibase

  - label: ":ray: rust _raylet compat preflight"
    key: rust-raylet-compat-preflight
    tags:
      - always
      - python
    instance_type: medium
    commands:
      - bazel run //ci/ray_ci:test_in_docker --
        //python/ray/tests:test_raylet_compat_surface
        core
        --install-mask all-ray-libraries
        --python-version 3.10 --build-name corebuild-py3.10
    depends_on:
      - rust-corebuild-py310
      - rust-ray-core-py310
      - rust-ray-dashboard

  - name: rust-ray-dashboard
    label: "wanda: rust dashboard (x86_64)"
    wanda: ci/docker/ray-dashboard.wanda.yaml
    env_file: rayci.env
    env:
      ARCH_SUFFIX: ""
      HOSTTYPE: "x86_64"
    depends_on:
      - forge
    tags:
      - always
      - release_wheels

  - label: ":ray: rust PR canary manifest"
    key: rust-pr-canary-manifest
    tags:
      - always
      - python
    instance_type: medium
    # Broad but bounded Rust-port canary. The manifest is the stable PR
    # iteration contract; keep packaging/minimal/wheel/tmpfs modes on narrow
    # smoke tests instead of repeating this whole suite.
    parallelism: 4
    commands:
      - |
        RAYRUST_CANARY_TARGETS="$(grep -Ev '^[[:space:]]*(#|$)' .buildkite/rayrust-pr-canary-targets.txt | tr '\n' ' ')"
        echo "RayRust PR canary targets: $RAYRUST_CANARY_TARGETS"
        bazel run //ci/ray_ci:test_in_docker -- $RAYRUST_CANARY_TARGETS core \
          --install-mask all-ray-libraries \
          --python-version 3.10 --build-name corebuild-py3.10 \
          --workers "$${BUILDKITE_PARALLEL_JOB_COUNT}" \
          --worker-id "$${BUILDKITE_PARALLEL_JOB}" --parallelism-per-worker 1
    depends_on:
      - rust-corebuild-py310
      - rust-ray-core-py310
      - rust-ray-dashboard
      - forge
