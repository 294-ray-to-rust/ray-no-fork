  #       --parallelism-per-worker 2
  #     - bazel run //ci/ray_ci:test_in_docker -- //doc/... core
  #       --install-mask all-ray-libraries
  #       --except-tags doctest,post_wheel_build,gpu,multi_gpu,mem_pressure
  #       --parallelism-per-worker 2
