name: "forge"
# LAN IP because go-containerregistry (used by wanda) needs bare IPs to fall back to HTTP.
froms:
  - 192.168.7.176:5010/dockerhub/library/ubuntu:22.04
build_args:
  - APT_PROXY
  - PIP_INDEX_URL
  - PIP_TRUSTED_HOST
  - BUILDKITE_BAZEL_CACHE_URL
dockerfile: ci/docker/forge.Dockerfile
srcs:
  - ci/k8s/install-k8s-tools.sh
